name: Panopticon Daily Cycle

on:
  schedule:
    # 01:23 UTC = 09:23 Taiwan（離開整點，避開 GitHub Actions 排程尖峰）
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write   # archive step commits daily health data back to main
  issues: write     # alerter opens an issue when anomalies are detected

# Serialized so two triggered runs can't race on the archive push
concurrency:
  group: panopticon-daily-cycle
  cancel-in-progress: false

jobs:
  daily-cycle:
    name: Monitor → Alerts → Inner Axis → Archive
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    # ── Outer axis · 外監 ──────────────────────────────────────────
    - name: Run ecosystem health check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python -m outer.monitor.checker --all --save

    - name: Check alerts (opens a GitHub issue on anomalies)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PANOPTICON_ALERT_ISSUES: "1"
      run: python -m outer.alerts.alerter --check

    # ── Inner axis · 內觀 ──────────────────────────────────────────
    # Journal data is local-only (gitignored), so these are no-ops in CI
    # until journal entries exist here; insights skip themselves on empty
    # data. Kept continue-on-error so a bad day can't block the archive.
    - name: Show today's reflection prompt
      run: python -m inner.journal.cli --today

    - name: Run pattern analysis
      run: python -m inner.patterns.analyzer --days 30
      continue-on-error: true

    - name: Run AI insights
      run: python -m inner.insights.generator --analyze
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      continue-on-error: true

    - name: Run cross-axis correlation
      run: python -m core.feedback.correlator --days 30
      continue-on-error: true

    # ── Archive · 回存 ─────────────────────────────────────────────
    # 每日健康報告回存 main —— 資料長期累積，且讓 repo 保持活躍
    # （GitHub 會停用 60 天無活動 repo 的排程工作流程）
    - name: Archive daily health data (commit to main)
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -f data/monitor
        if git diff --cached --quiet; then
          echo "No new data to archive."
        else
          git commit -m "data: archive $(date -u +%F) ecosystem health report"
          git push
        fi
