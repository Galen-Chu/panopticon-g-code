name: Panopticon Daily Cycle

on:
  schedule:
    # 01:23 UTC = 09:23 Taiwan（離開整點，避開 GitHub Actions 排程尖峰）
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write   # archive step commits daily health data back to main
  issues: write     # alerter opens an issue when anomalies are detected

# Serialized so two triggered runs can't race on the archive push
concurrency:
  group: panopticon-daily-cycle
  cancel-in-progress: false

jobs:
  daily-cycle:
    name: Monitor → Alerts → Archive
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    # ── Outer axis · 外監 ──────────────────────────────────────────
    - name: Run ecosystem health check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python -m outer.monitor.checker --all --save

    - name: Check alerts (opens a GitHub issue on anomalies)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PANOPTICON_ALERT_ISSUES: "1"
      run: python -m outer.alerts.alerter --check

    # ── Archive · 回存 ─────────────────────────────────────────────
    # 每日健康報告回存 main —— 資料長期累積，且讓 repo 保持活躍
    # （GitHub 會停用 60 天無活動 repo 的排程工作流程）
    - name: Compact previous month (no-op except on the 1st)
      run: python -m outer.monitor.compact

    - name: Archive daily health data (commit to main)
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -f data/monitor
        if [ -d data/state ]; then git add -f data/state; fi
        if git diff --cached --quiet; then
          echo "No new data to archive."
        else
          git commit -m "data: archive $(date -u +%F) ecosystem health report"
          git push
        fi

    # ── Self-watch · 自我監看 ───────────────────────────────────────
    # The watchtower needs its own watchtower: a failed daily cycle
    # would otherwise only go red in the Actions tab.
    - name: Report workflow failure (opens an issue)
      if: failure()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python -m outer.alerts.alerter --report-failure
