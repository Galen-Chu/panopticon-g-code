<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👁️ Panopticon — G-Code Ecosystem Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 2rem;
        }
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .header h1 {
            font-size: 2.5rem;
            color: #a78bfa;
            margin-bottom: 0.5rem;
        }
        .header p { color: #888; font-size: 1rem; }
        .header .zh { color: #666; font-size: 0.9rem; margin-top: 0.3rem; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto 3rem;
        }
        .stat-card {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-value { font-size: 3rem; font-weight: bold; color: #a78bfa; }
        .stat-label { color: #888; font-size: 0.9rem; margin-top: 0.5rem; }
        .stat-sub { color: #555; font-size: 0.8rem; }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .repo-card {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .repo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }
        .repo-card.healthy::before { background: linear-gradient(90deg, #22c55e, #16a34a); }
        .repo-card.not_found::before { background: linear-gradient(90deg, #eab308, #ca8a04); }
        .repo-card.error::before { background: linear-gradient(90deg, #ef4444, #dc2626); }

        .repo-name { font-size: 1.2rem; font-weight: 600; color: #a78bfa; margin-bottom: 0.5rem; }
        .repo-status {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .repo-status.healthy { background: #052e16; color: #22c55e; }
        .repo-status.not_found { background: #422006; color: #eab308; }
        .repo-status.error { background: #450a0a; color: #ef4444; }

        .repo-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .detail { color: #888; font-size: 0.85rem; }
        .detail strong { color: #ccc; }

        .pulse {
            width: 12px; height: 12px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
            70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); }
            100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
        }

        .footer {
            text-align: center;
            margin-top: 3rem;
            color: #444;
            font-size: 0.8rem;
        }
        .loading {
            text-align: center;
            padding: 4rem;
            color: #666;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>👁️ Panopticon G-Code</h1>
        <p>Ecosystem Health Dashboard</p>
        <p class="zh">G-Code 生態系統健康儀表板</p>
    </div>

    <div class="stats-grid" id="stats"></div>
    <div class="repo-grid" id="repos"></div>

    <div class="footer">
        <p><span class="pulse"></span>The observer and the observed are one.</p>
        <p class="zh">觀察者與被觀察者是一體的。</p>
    </div>

    <script>
        async function loadHealth() {
            const statsEl = document.getElementById('stats');
            const reposEl = document.getElementById('repos');
            statsEl.innerHTML = '<div class="loading">Loading ecosystem data...</div>';

            try {
                const response = await fetch('/api/health');
                const data = await response.json();

                if (data.error) {
                    statsEl.innerHTML = `<div class="loading">${data.error}</div>`;
                    return;
                }

                // Render stats
                statsEl.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${data.total_repos || 0}</div>
                        <div class="stat-label">Total Repos</div>
                        <div class="stat-sub">G-Code Family</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color:#22c55e">${data.healthy || 0}</div>
                        <div class="stat-label">Healthy</div>
                        <div class="stat-sub">All systems normal</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" style="color:${(data.issues || 0) > 0 ? '#ef4444' : '#22c55e'}">${data.issues || 0}</div>
                        <div class="stat-label">Issues</div>
                        <div class="stat-sub">Need attention</div>
                    </div>
                `;

                // Render repo cards
                const repos = data.repos || [];
                reposEl.innerHTML = repos.map(repo => {
                    const status = repo.status || 'unknown';
                    const stars = repo.stars || 0;
                    const issues = repo.open_issues || 0;
                    const lastPush = (repo.last_push || '').split('T')[0];

                    return `
                        <div class="repo-card ${status}">
                            <div class="repo-name">${repo.repo}</div>
                            <span class="repo-status ${status}">${status}</span>
                            <div class="repo-details">
                                <div class="detail">⭐ <strong>${stars}</strong> stars</div>
                                <div class="detail">📋 <strong>${issues}</strong> open issues</div>
                                <div class="detail">🌿 <strong>${repo.default_branch || 'main'}</strong></div>
                                <div class="detail">📅 <strong>${lastPush || '—'}</strong></div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                statsEl.innerHTML = `<div class="loading">Error: ${err.message}</div>`;
            }
        }

        loadHealth();
        setInterval(loadHealth, 60000); // Refresh every minute
    </script>
</body>
</html>
